# Testa e publica o site no GitHub Pages a cada push na main.
#
# Precisa (uma vez, no GitHub):
#   Settings -> Pages -> Source: "GitHub Actions"
#   Settings -> Secrets and variables -> Actions -> aba "Variables":
#     SUPABASE_URL    https://xxxx.supabase.co
#     SUPABASE_CHAVE  a chave PUBLISHABLE (sb_publishable_...) -- nunca a secreta
#
# Se a chave for a secreta, o passo "Gerar config.js" falha e nada e publicado.

name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Copiar bibliotecas
        run: npm run vendor
      - name: Gerar config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_CHAVE: ${{ vars.SUPABASE_CHAVE }}
        run: node ferramentas/gerar-config.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deploy
        uses: actions/deploy-pages@v4
