<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NuControle</title>
  <link rel="icon" type="image/png" href="img/icone.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Icones usados pela interface (referenciados com <use href="#i-...">) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h13V9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-lista" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-cartao" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M7 15h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-cofre" viewBox="0 0 24 24"><path d="M5 8.5a7 7 0 0 1 13.2-1.5H20v4h-1.2A7 7 0 0 1 16 15.6V19h-3v-2h-2v2H8v-3.3A7 7 0 0 1 5 8.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 7.5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-pessoas" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 5.6a3.2 3.2 0 0 1 0 5.8M17.5 14.3A5.5 5.5 0 0 1 20.5 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-ajustes" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-esq" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-dir" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-editar" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4ZM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-lixo" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-pular" viewBox="0 0 24 24"><path d="M5 12h11M12 7l5 5-5 5M20 6v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-fim" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-arquivo" viewBox="0 0 24 24"><path d="M4 5h16v4H4zM5.5 9v10h13V9M10 13h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-dividir" viewBox="0 0 24 24"><path d="M12 3v18M7 8H4.5M7 16H4.5M19.5 8H17M19.5 16H17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <aside class="lateral">
      <div class="marca">
        <img class="marca-logo" src="img/icone.png" alt="" aria-hidden="true">
        <span class="marca-nome">NuControle</span>
      </div>
      <nav class="nav" id="nav">
        <button data-tela="visao"><svg><use href="#i-home"/></svg>Visão geral</button>
        <button data-tela="gastos"><svg><use href="#i-lista"/></svg>Gastos do mês</button>
        <button data-tela="cartao"><svg><use href="#i-cartao"/></svg>Cartão</button>
        <button data-tela="caixinhas"><svg><use href="#i-cofre"/></svg>Caixinhas</button>
        <button data-tela="terceiros"><svg><use href="#i-pessoas"/></svg>Terceiros</button>
        <button data-tela="ajustes"><svg><use href="#i-ajustes"/></svg>Ajustes</button>
      </nav>
      <div class="mes-global">
        <span class="mes-global-rotulo">Mês</span>
        <div class="seletor-mes" id="sel-mes-global">
          <button class="btn-icone" data-delta="-1" aria-label="Mês anterior" data-dica="Mês anterior (Ctrl+←)"><svg><use href="#i-esq"/></svg></button>
          <span id="mes-global-nome"></span>
          <button class="btn-icone" data-delta="1" aria-label="Próximo mês" data-dica="Próximo mês (Ctrl+→)"><svg><use href="#i-dir"/></svg></button>
        </div>
        <button class="mes-hoje" id="mes-hoje" hidden>Voltar para hoje</button>
      </div>
      <button class="btn btn-primario btn-novo" id="btn-novo">
        <svg><use href="#i-mais"/></svg>Novo lançamento
      </button>
    </aside>

    <main class="principal">
      <header class="topo">
        <div>
          <h1 id="titulo">Visão geral</h1>
          <p class="subtitulo" id="subtitulo"></p>
        </div>
        <div class="topo-acoes" id="topo-acoes"></div>
      </header>
      <section id="conteudo" class="conteudo" aria-live="polite">
        <div class="carregando">Carregando…</div>
      </section>
    </main>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-caixa" id="modal-form" novalidate>
      <header class="modal-topo">
        <h2 id="modal-titulo"></h2>
        <button type="button" class="btn-icone" data-fechar aria-label="Fechar"><svg><use href="#i-x"/></svg></button>
      </header>
      <div class="modal-corpo" id="modal-corpo"></div>
      <p class="modal-erro" id="modal-erro" role="alert" hidden></p>
      <footer class="modal-rodape" id="modal-rodape"></footer>
    </form>
  </dialog>

  <div class="avisos" id="avisos" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/graficos.js"></script>
  <script src="js/lancamento.js"></script>
  <script src="js/telas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
